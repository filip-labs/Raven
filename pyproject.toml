[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "raven-vision"
version = "0.0.1"
description = "LiDAR perception research starter for Raven"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
visualization = ["open3d>=0.18"]
preprocessing = ["scipy>=1.10,<2"]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.10,<2", "shapely==2.1.2"]
evaluation = ["shapely==2.1.2"]
modal = ["modal==1.6.4"]
# 6.12.0 can abort Python 3.11 with a binding-level None refcount failure.
studio = ["PySide6-Essentials>=6.8,!=6.12.0,<7"]

[project.scripts]
raven = "raven.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raven"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/raven/evaluation/_vendor"]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
"configs/kitti_splits" = "raven/experiments/kitti_splits"
